# Publishes the Fern-generated SDK to npm via OIDC trusted publishing (the
# npm package trusts this repo + workflow file; no token). Triggered when a
# GitHub release is published, or manually to re-publish after a failure.
#
# This file is listed in .fernignore so Fern regeneration preserves it.
name: Publish NPM
on:
  workflow_dispatch:

  release:
    types: [published]

jobs:
  publish:
    name: publish
    # Keep in sync with the npm trusted publisher registration, which pins
    # this environment name.
    environment: prod
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing requires npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install and build
        run: |
          npm install
          npm run build --if-present

      - name: Publish to NPM
        run: npm publish --access public
