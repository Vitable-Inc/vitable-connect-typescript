# Publishes the Fern-generated SDK to npm via OIDC trusted publishing. The
# npm package trusts this repo + this workflow file + the `prod` environment;
# do not rename any of the three without updating the registration.
#
# Triggers on tag pushes because Fern (github mode: release) creates tags, not
# GitHub releases. This file is listed in .fernignore so Fern regeneration
# preserves it.
name: Publish NPM
on:
  workflow_dispatch:

  push:
    tags:
      # Fern tags bare semver (1.0.1); v-prefixed kept for manual tags.
      - "[0-9]*"
      - "v[0-9]*"

  release:
    types: [published]

jobs:
  publish:
    name: publish
    # Keep in sync with the npm trusted publisher registration, which pins
    # this environment name.
    environment: prod
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      # Reads the pinned version from package.json's packageManager field.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing requires npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # npm (not pnpm) does the publish: it carries the OIDC trusted
      # publishing support.
      - name: Publish to NPM
        run: npm publish --access public
